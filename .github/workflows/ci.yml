# Continuous integration: build, tests, vulnerability scans, secret scan, branding check, shell and image checks.
# A release is a tagged commit that passes this workflow (CLAUDE.md, Conventions).
#
# Third-party actions are pinned by full commit SHA (the comment names the version). Update SHA and comment together.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  dotnet:
    name: .NET build, tests and vulnerable packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Same pin as POSTGRES_IMAGE in deploy/install.sh.
        image: timescale/timescaledb:2.30.0-pg17@sha256:3113d12b78392c064aa7475caf7a52b447b29ddd4f9bfd23526733fcb03e3459
        env:
          # Throwaway CI database, reachable only from this job.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      FLEETIFY_TEST_ADMIN_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Fleetify.slnx

      - name: Build
        # Warnings are handled as configured in the repository (.editorconfig, Directory.Build.props).
        run: dotnet build Fleetify.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Fleetify.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Vulnerable packages (direct and transitive)
        run: |
          dotnet list Fleetify.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qE "has the following vulnerable packages|error NU[0-9]+|error:" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found (or the check failed). See the output above."
            exit 1
          fi

  go:
    name: Go agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache-dependency-path: agent/go.sum

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Cross-build windows/amd64 and linux/amd64
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/windows-amd64/fleetify-agent.exe ./cmd/fleetify-agent
          GOOS=linux GOARCH=amd64 go build -trimpath -o dist/linux-amd64/fleetify-agent ./cmd/fleetify-agent

      - name: govulncheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          GOOS=windows go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  protocol-generate:
    name: Go protocol code is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache-dependency-path: agent/go.sum

      - name: Regenerate agent.pb.go with the same protoc as agent/generate.ps1
        run: |
          # protoc comes from the Grpc.Tools NuGet package that Fleetify.Protocol restores (signed package, pinned in
          # Directory.Packages.props), so C# and Go are generated by the same protoc version.
          dotnet restore src/Fleetify.Protocol/Fleetify.Protocol.csproj
          grpc_version="$(grep -oP '<PackageVersion Include="Grpc.Tools" Version="\K[^"]+' Directory.Packages.props)"
          tools="$HOME/.nuget/packages/grpc.tools/$grpc_version"
          chmod +x "$tools/tools/linux_x64/protoc"
          protoc_gen_go_version="$(grep -oP "ProtocGenGoVersion = '\K[^']+" agent/generate.ps1)"
          GOBIN="$RUNNER_TEMP/bin" go install "google.golang.org/protobuf/cmd/protoc-gen-go@$protoc_gen_go_version"
          PATH="$RUNNER_TEMP/bin:$PATH" "$tools/tools/linux_x64/protoc" \
            --proto_path=src/Fleetify.Protocol/Protos --proto_path="$tools/build/native/include" \
            --go_out=agent/internal/protocol/agentv1 --go_opt=paths=source_relative \
            src/Fleetify.Protocol/Protos/agent.proto

      - name: Fail when the generated code differs
        run: |
          if ! git diff --exit-code -- agent/internal/protocol; then
            echo "::error::agent/internal/protocol is out of date. Run agent/generate.ps1 and commit the result."
            exit 1
          fi

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          curl --fail --silent --show-error --location --proto '=https' --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the full git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .

  branding:
    name: Branding check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash deploy/ci/branding-check.sh

  shell:
    name: Shell scripts (shellcheck, bundle, install.sh self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: |
          shellcheck --version
          find deploy -name '*.sh' -path '*/postgres/*' -print0 | xargs -0 --no-run-if-empty shellcheck --shell=sh
          find deploy -name '*.sh' -not -path '*/postgres/*' -print0 | xargs -0 --no-run-if-empty shellcheck --external-sources

      - name: install.sh self-test (no Docker parts)
        run: bash deploy/ci/test-deploy.sh

  docker:
    name: Docker image ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: src/Fleetify.Web/Dockerfile
            context: .
          - image: gateway
            dockerfile: src/Fleetify.Gateway/Dockerfile
            context: .
          - image: signer
            dockerfile: src/Fleetify.Signer/Dockerfile
            context: .
          - image: workers
            dockerfile: src/Fleetify.Workers/Dockerfile
            context: .
          - image: tool
            dockerfile: src/Fleetify.Tools/Dockerfile
            context: .
          - image: caddy
            dockerfile: deploy/caddy/Dockerfile
            context: deploy/caddy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build (no push)
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build --pull --file "${{ matrix.dockerfile }}" --tag "fleetify-${{ matrix.image }}:ci" \
            --build-arg FLEETIFY_VERSION=0.0.0-ci "${{ matrix.context }}"

      - name: Image runs as a non-root user
        if: matrix.image != 'caddy'
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' "fleetify-${{ matrix.image }}:ci")"
          echo "User: $user"
          [ "$user" = "10001:10001" ]

      - name: Agent binary is present
        if: matrix.image == 'web'
        run: docker run --rm --entrypoint ls "fleetify-web:ci" -l /app/agent/windows-amd64/fleetify-agent.exe

      - name: Caddyfile and Compose validation with the built proxy image
        if: matrix.image == 'caddy'
        run: bash deploy/ci/test-deploy.sh --caddy-image fleetify-caddy:ci
