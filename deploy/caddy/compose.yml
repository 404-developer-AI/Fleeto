# Fleeto host proxy: one Caddy per VPS, shared by every instance on it. install.sh copies this file to
# /opt/fleeto/caddy/compose.yml and runs it as Compose project "fleeto-caddy":
#
#   docker compose --project-name fleeto-caddy --env-file /opt/fleeto/caddy/caddy.conf \
#     -f /opt/fleeto/caddy/compose.yml up -d
#
# caddy.conf holds only CADDY_IMAGE (an image reference by digest); it contains no secrets. The Caddyfile in
# /opt/fleeto/caddy/config/ is generated by install.sh from all instances; do not edit it by hand.
#
# Caddy holds the TLS private keys and ACME account of every instance FQDN on this VPS (ARCHITECTURE.md section 5, Other
# controls). It never sees agent traffic in plaintext: agents.<fqdn> is passed through by SNI.
name: fleeto-caddy

services:
  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE must be set in caddy.conf}
    container_name: fleeto-caddy
    # Host networking: Caddy must reach the instances' loopback-only ports (127.0.0.1:<port>) and bind 80/443.
    network_mode: host
    restart: unless-stopped
    # Root inside the container, but with every capability dropped except binding ports below 1024. A non-root user
    # would need file capabilities, which no-new-privileges blocks.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /run/caddy:rw,noexec,nosuid,nodev,size=1m,mode=0700
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      # A directory, not a single file: install.sh replaces the Caddyfile atomically (new inode), which a
      # single-file bind mount would not see.
      - ./config:/etc/caddy:ro
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  caddy-data:
  caddy-config:
